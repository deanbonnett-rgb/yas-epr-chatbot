name: Build Parked Video APK

on:
  push:
    paths:
      - "android-auto-video/**"
      - ".github/workflows/android-auto-video.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-auto-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: parked-video-apk
          path: android-auto-video/app/build/outputs/apk/debug/app-debug.apk
